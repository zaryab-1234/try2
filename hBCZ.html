<!DOCTYPE html>
<html>
<head>
  <title>JS Example</title>
</head>
<body>
  <h1 id="title">Hello</h1>
  <button onclick="changeText()">Click Me</button>

  <script>
    function changeText() {
      document.getElementById("title").innerText.toggle = "Hello, JavaScript!";
    }
  </script>
</body>
</html>
